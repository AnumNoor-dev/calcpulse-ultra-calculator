<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CalcPulse Pro - Futuristic Financial & Scientific Suite</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="background-glow"></div>

  <div class="calculator-card">
    <!-- Header -->
    <header class="calc-header">
      <div class="brand">
        <div class="logo-icon">⚡</div>
        Calc<span>Pulse</span> <small>PRO</small>
      </div>
      <div class="mode-switch-wrapper">
        <button class="mode-pill active" data-mode="standard">Std</button>
        <button class="mode-pill" data-mode="scientific">Sci</button>
        <button class="mode-pill" data-mode="financial">EMI</button>
      </div>
    </header>

    <!-- Display Screen -->
    <div class="display-container">
      <div class="status-indicator" id="statusBadge">Standard Mode</div>
      <div id="historyDisplay" class="history-text"></div>
      <div id="mainDisplay" class="main-text">0</div>
    </div>

    <!-- Standard & Scientific Keypad Grid -->
    <div id="standardKeypad" class="keypad-grid">
      <!-- Sci Row -->
      <button class="btn sci-btn hide" data-action="sin">sin</button>
      <button class="btn sci-btn hide" data-action="cos">cos</button>
      <button class="btn sci-btn hide" data-action="tan">tan</button>
      <button class="btn sci-btn hide" data-action="sqrt">√x</button>
      <button class="btn sci-btn hide" data-action="pow">x²</button>

      <!-- Row 1 -->
      <button class="btn action-btn" data-action="clear">AC</button>
      <button class="btn action-btn" data-action="backspace">⌫</button>
      <button class="btn action-btn" data-action="percent">%</button>
      <button class="btn operator-btn" data-action="/">÷</button>

      <!-- Row 2 -->
      <button class="btn num-btn" data-val="7">7</button>
      <button class="btn num-btn" data-val="8">8</button>
      <button class="btn num-btn" data-val="9">9</button>
      <button class="btn operator-btn" data-action="*">×</button>

      <!-- Row 3 -->
      <button class="btn num-btn" data-val="4">4</button>
      <button class="btn num-btn" data-val="5">5</button>
      <button class="btn num-btn" data-val="6">6</button>
      <button class="btn operator-btn" data-action="-">-</button>

      <!-- Row 4 -->
      <button class="btn num-btn" data-val="1">1</button>
      <button class="btn num-btn" data-val="2">2</button>
      <button class="btn num-btn" data-val="3">3</button>
      <button class="btn operator-btn" data-action="+">+</button>

      <!-- Row 5 -->
      <button class="btn num-btn zero-btn" data-val="0">0</button>
      <button class="btn num-btn" data-val=".">.</button>
      <button class="btn equals-btn" data-action="equals">=</button>
    </div>

    <!-- Financial Panel -->
    <div id="financialPanel" class="financial-panel hide">
      <div class="input-card">
        <label>Principal Amount ($ / Rs)</label>
        <input type="number" id="loanAmount" value="500000">
      </div>
      <div class="input-card">
        <label>Interest Rate (% Per Annum)</label>
        <input type="number" id="interestRate" value="12">
      </div>
      <div class="input-card">
        <label>Tenure Period (Years)</label>
        <input type="number" id="loanTenure" value="3">
      </div>
      <button id="calcEmiBtn" class="glow-submit-btn">Calculate EMI Breakdown</button>

      <div class="emi-results-grid hide" id="emiResults">
        <div class="result-box">
          <span>Monthly EMI</span>
          <h3 id="monthlyEmiVal">$0</h3>
        </div>
        <div class="result-box accent">
          <span>Total Interest</span>
          <h3 id="totalInterestVal">$0</h3>
        </div>
      </div>
    </div>

    <!-- History Drawer -->
    <div class="history-card">
      <div class="history-header">
        <span>📜 Tape Memory Log</span>
        <button id="clearHistoryBtn">Clear</button>
      </div>
      <ul id="historyList" class="history-stream">
        <li class="empty-log">No previous calculations recorded</li>
      </ul>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
